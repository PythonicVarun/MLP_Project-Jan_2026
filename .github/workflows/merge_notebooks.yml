name: Merge Notebooks for Competition

on:
  push:
    paths:
      - 'milestones/**.ipynb'
      - 'competition.ipynb'
      - 'scripts/merge.py'
  workflow_dispatch:

jobs:
  build-and-merge:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v6

      - name: ⚡ Install uv
        uses: astral-sh/setup-uv@v7

      - name: 🌳 Sync dependencies
        run: uv sync

      - name: 📒 Install nbformat
        run: |
          uv pip install nbformat

      - name: 🚀 Run Merge Script
        run: |
          uv run scripts/merge.py

      - name: 💾 Commit and Push Result
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Check if the output file has changed
          if [[ -n $(git status -s "24f2004142-notebook-t12026.ipynb") ]]; then
            git add "24f2004142-notebook-t12026.ipynb"
            git commit -m "🤖 Auto-generate submission notebook [skip ci]"
            git push
          else
            echo "❌ No changes detected in the output notebook."
          fi
