name: Build, Ty Check & Deploy

on:
  push:
    branches:
      - master
    paths:
      - 'milestones/**.ipynb'
      - 'competition.ipynb'
      - 'scripts/merge.py'
      - '**/*.py'
      - 'pyproject.toml'
      - 'uv.lock'
  workflow_dispatch:

jobs:
  ty-check-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 🛎️ Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: ⚡ Install uv
        uses: astral-sh/setup-uv@v7

      - name: 🌳 Sync dependencies
        run: uv sync

      - name: 📒 Install nbformat
        run: uv pip install nbformat

      - name: 🔨 Run Merge Script
        run: uv run scripts/merge.py

      - name: 🔍 Run ty
        run: uvx ty check .

      - name: 📈 Push to Kaggle
        if: success() && github.event_name == 'push'
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          TARGET_FILE="competition.ipynb"

          echo "Notebook file: $TARGET_FILE"

          BEFORE_SHA=${{ github.event.before }}
          if [[ $BEFORE_SHA == "0000000000000000000000000000000000000000" ]]; then
              BEFORE_SHA="HEAD~1"
          fi

          # github.event.before = commit before push
          # github.sha = current commit
          CHANGED_FILES=$(git diff --name-only "$BEFORE_SHA" ${{ github.sha }})
          if [[ "$CHANGED_FILES" == "$TARGET_FILE" ]]; then
            echo "✅ Changes detected in $TARGET_FILE. Pushing to Kaggle..."
            uvx kaggle kernels push
          else
            echo "🚫 No changes detected in $TARGET_FILE. Skipping push."
          fi

      - name: 💾 Push to 'output' branch
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          FILENAME="24f2004142-notebook-t12026.ipynb"

          if [ -f "$FILENAME" ]; then
            echo "ℹ️  Found $FILENAME, stashing..."
            mv "$FILENAME" /tmp/submission.ipynb
          else
            echo "❌ Generated file $FILENAME not found!" && exit 1
          fi

          echo "ℹ️ Switching to output branch..."
          (git fetch origin output && git checkout -B output origin/output) || git checkout -B output

          echo "ℹ️ Restoring notebook..."
          mv /tmp/submission.ipynb "$FILENAME"

          if echo "$CHANGED_FILES" | grep -qx "$TARGET_FILE"; then
            git add "$FILENAME"
            git commit -m "🤖 auto: update submission notebook"
            git push origin output
            echo "✅ Pushed new version to output branch."
          else
            echo "🚫 No changes detected in $FILENAME. Nothing to push."
          fi
