name: Ty Check & Deploy

on:
  push:
    paths:
      - '**/*.py'
      - '**/*.ipynb'
      - 'pyproject.toml'
      - 'uv.lock'

jobs:
  ty-check-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 🛎️ Checkout
        uses: actions/checkout@v5

      - name: ⚡ Install uv
        uses: astral-sh/setup-uv@v7

      - name: 🌳 Sync dependencies
        run: uv sync

      - name: 🚀 Run ty
        run: uvx ty check .

      - name: 📈 Push to Kaggle
        if: success()
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: uvx kaggle kernels push
