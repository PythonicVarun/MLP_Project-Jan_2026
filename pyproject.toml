[project]
name = "comment-category-prediction-challenge"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "jupyterlab>=4.5.3",
    "lightgbm>=4.6.0",
    "marimo>=0.19.6",
    "matplotlib>=3.10.8",
    "numpy>=2.4.1",
    "pandas>=3.0.0",
    "scikit-learn>=1.8.0",
    "scipy>=1.17.0",
    "seaborn>=0.13.2",
    "xgboost>=3.1.3",
]

[dependency-groups]
dev = [
    "black[jupyter]>=26.1.0",
    "isort>=7.0.0",
    "nbqa>=1.9.1",
    "pandas-stubs>=3.0.0.260204",
    "pre-commit>=4.5.1",
    "scipy-stubs>=1.17.0.2",
]

[tool.isort]
line_length = 88
profile = "black"
multi_line_output = 3

[tool.black]
line-length = 88
